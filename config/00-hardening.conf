PermitRootLogin no
PasswordAuthentication no
PubkeyAuthentication yes
MaxAuthTries 2
LoginGraceTime 25
X11Forwarding no
AllowTcpForwarding no

# Users allowed to establish an SSH connection to the server
AllowUsers DEIN_BENUTZER

# Disconnect after inactivity (increase if needed)
ClientAliveInterval 120
ClientAliveCountMax 1

# 2FA
UsePAM yes
KbdInteractiveAuthentication yes
AuthenticationMethods publickey,keyboard-interactive